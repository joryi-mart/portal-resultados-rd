name: Scraper de resultados

on:
  schedule:
    # Corre cada 2 minutos, todo el día. El repositorio es público, así que
    # GitHub Actions es gratis e ilimitado (no hay límite de minutos que cuidar).
    - cron: "*/2 * * * *"
  workflow_dispatch: # permite correrlo manualmente desde la pestaña "Actions" en GitHub

jobs:
  scrapear:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Correr el scraper (loterias dominicanas)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/guardar_resultados_v3.py

      - name: "Correr el scraper (loterias americanas: New Jersey y Georgia)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/guardar_americanas.py
