name: Scraper de resultados

on:
  schedule:
    # Corre cada 30 minutos, todo el día. GitHub Actions es gratis para repos
    # públicos y da 2000 minutos/mes gratis en repos privados (esto usa muy poco).
    - cron: "*/30 * * * *"
  workflow_dispatch: # permite correrlo manualmente desde la pestaña "Actions" en GitHub

jobs:
  scrapear:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Correr el scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/guardar_resultados_v3.py
