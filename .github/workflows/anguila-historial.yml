name: Historial de Anguila de cada hora (una sola vez)

# Agrega los 11 sorteos de Anguila de cada hora (si faltan) y carga los
# resultados de los ultimos dias, para que sus paginas tengan historial desde
# el primer dia. Corre solo una vez al subir este archivo, o a mano desde la
# pestaña "Actions" de GitHub.
on:
  push:
    paths:
      - ".github/workflows/anguila-historial.yml"
      - "scraper/agregar_sorteos_anguila.py"
  workflow_dispatch:
    inputs:
      dias:
        description: "Cuantos dias hacia atras"
        default: "30"

jobs:
  historial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scraper/requirements.txt
      - name: Agregar los sorteos de cada hora (si faltan)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/agregar_sorteos_anguila.py
      - name: Cargar historial
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/guardar_anguila_horas.py --dias ${{ github.event.inputs.dias || '30' }}
