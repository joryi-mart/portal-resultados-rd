name: Historial de Anguila de cada hora (una sola vez)

# Carga los resultados de los ultimos dias de los 11 sorteos de Anguila que se
# agregaron el 30-oct-2026, para que sus paginas tengan historial desde el
# primer dia. Se corre a mano desde la pestaña "Actions" de GitHub.
on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Cuantos dias hacia atras"
        default: "30"

jobs:
  historial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scraper/requirements.txt
      - name: Cargar historial
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/guardar_anguila_horas.py --dias ${{ github.event.inputs.dias }}
