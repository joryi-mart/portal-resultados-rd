<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo La Banquera">
  <!-- fondo circular azul -->
  <circle cx="60" cy="60" r="57" fill="#1B4B91" stroke="#E7A63C" stroke-width="4"/>

  <!-- sombra suave de las bolas -->
  <ellipse cx="63" cy="90" rx="34" ry="6" fill="#0F2E5C" opacity="0.35"/>

  <!-- bola 1 -->
  <circle cx="39" cy="72" r="17" fill="#FBF7EE"/>
  <circle cx="34" cy="67" r="4.5" fill="#ffffff" opacity="0.55"/>
  <text x="39" y="77.5" font-family="'Space Mono', monospace" font-weight="700" font-size="15" fill="#1B4B91" text-anchor="middle">7</text>

  <!-- bola 2 (la más grande, al centro) -->
  <circle cx="67" cy="53" r="20" fill="#FBF7EE"/>
  <circle cx="61" cy="47" r="5" fill="#ffffff" opacity="0.55"/>
  <text x="67" y="59.5" font-family="'Space Mono', monospace" font-weight="700" font-size="16" fill="#1B4B91" text-anchor="middle">14</text>

  <!-- bola 3 -->
  <circle cx="83" cy="80" r="14" fill="#FBF7EE"/>
  <circle cx="79" cy="76.5" r="3.5" fill="#ffffff" opacity="0.55"/>
  <text x="83" y="84.5" font-family="'Space Mono', monospace" font-weight="700" font-size="12" fill="#1B4B91" text-anchor="middle">25</text>
</svg>
